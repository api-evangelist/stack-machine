aid: stack-machine
name: Stack Machine
description: StackMachine is elastic, headless infrastructure for AI applications and agents.
  It runs existing Node.js, Python, and PHP codebases as WebAssembly with sub-5ms cold starts
  and sandboxed execution for untrusted or AI-generated code, packing thousands of apps per
  server. The platform is driven by a single GraphQL API (api.stackmachine.com/graphql) plus
  official JavaScript and Python SDKs, exposing app deployment, custom domains and DNS, managed
  databases and volumes, cron jobs, secrets, transactional email, cloud storage, package
  publishing, SSH access, and usage metering. Backed by a16z.
